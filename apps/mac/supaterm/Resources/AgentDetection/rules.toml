format_version = 1
generation = 1
minimum_engine_version = 1

[[agents]]
id = "claude"
display_name = "Claude Code"
processes = [
  { executable = "claude" },
  { executable = "node", script_suffix = "/@anthropic-ai/claude-code/cli.js" },
]

[[agents.rules]]
id = "title_running"
result = "running"
priority = 1000
region = { source = "title" }
when = { regex = '^[⠀-⣿] ' }

[[agents.rules]]
id = "transcript"
result = "hold"
priority = 900
region = { source = "screen", last_lines = 8, non_empty = true }
when = { all = [
  { contains_case_insensitive = "showing detailed transcript" },
  { any = [
    { contains_case_insensitive = "ctrl+o" },
    { contains_case_insensitive = "ctrl+e" },
  ] },
] }

[[agents.rules]]
id = "permission"
result = "needs_input"
priority = 800
region = { source = "screen", last_lines = 12, non_empty = true }
when = { all = [
  { contains_case_insensitive = "esc to cancel" },
  { any = [
    { contains_case_insensitive = "enter to confirm" },
    { contains_case_insensitive = "enter to select" },
    { contains_case_insensitive = "do you want to proceed?" },
  ] },
] }

[[agents.rules]]
id = "prompt_idle"
result = "idle"
priority = 200
region = { source = "screen", last_lines = 3, non_empty = true }
when = { line_regex = '^\s*❯\s*$' }

[[agents.rules]]
id = "title_idle"
result = "idle"
priority = 100
region = { source = "title" }
when = { regex = '^✳ ' }

[[agents]]
id = "codex"
display_name = "Codex"
processes = [
  { executable = "codex" },
  { executable = "node", script_suffix = "/@openai/codex/bin/codex.js" },
]

[[agents.rules]]
id = "title_needs_input"
result = "needs_input"
priority = 1100
region = { source = "title" }
when = { contains = "Action Required" }

[[agents.rules]]
id = "title_running"
result = "running"
priority = 1000
region = { source = "title" }
when = { regex = '(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)' }

[[agents.rules]]
id = "transcript"
result = "hold"
priority = 900
region = { source = "screen", last_lines = 8, non_empty = true }
when = { all = [
  { contains_case_insensitive = "pgup/pgdn" },
  { contains_case_insensitive = "home/end" },
  { contains_case_insensitive = "q to quit" },
] }

[[agents.rules]]
id = "permission"
result = "needs_input"
priority = 800
region = { source = "screen", last_lines = 12, non_empty = true }
when = { any = [
  { contains_case_insensitive = "press enter to confirm or esc to cancel" },
  { contains_case_insensitive = "allow command?" },
  { contains_case_insensitive = "enter to submit answer" },
] }

[[agents.rules]]
id = "screen_running"
result = "running"
priority = 500
region = { source = "screen", last_lines = 3, non_empty = true }
when = { line_regex = '^[•◦]\s+Working \([^)]*esc to interrupt\)(?: · .*)?$' }

[[agents.rules]]
id = "prompt_idle"
result = "idle"
priority = 100
region = { source = "screen", last_lines = 3, non_empty = true }
when = { line_regex = '^›\s*$' }

[[agents]]
id = "pi"
display_name = "Pi"
processes = [
  { executable = "pi" },
  { executable = "node", script_suffix = "/@mariozechner/pi-coding-agent/dist/cli.js" },
  { executable = "node", script_suffix = "/@earendil-works/pi-coding-agent/dist/cli.js" },
]

[[agents.rules]]
id = "permission"
result = "needs_input"
priority = 300
region = { source = "screen", last_lines = 8, non_empty = true }
when = { any = [
  { contains_case_insensitive = "press enter to continue" },
  { contains_case_insensitive = "allow this command?" },
] }

[[agents.rules]]
id = "screen_running"
result = "running"
priority = 200
region = { source = "screen", last_lines = 8, non_empty = true }
when = { contains = "Working..." }

[[agents.rules]]
id = "prompt_idle"
result = "idle"
priority = 100
region = { source = "screen", last_lines = 3, non_empty = true }
when = { line_regex = '^>\s*$' }
