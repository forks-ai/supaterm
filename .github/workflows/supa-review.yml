name: SupaReview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: supabitapp/supareview/.github/workflows/supareview-review.yml@3236a7a31d7505312d6d050ccb1232b81bf73e08
    secrets:
      CODEX_BALANCER_API_KEY: ${{ secrets.CODEX_BALANCER_API_KEY }}
