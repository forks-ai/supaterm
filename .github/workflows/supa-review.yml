name: SupaReview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: supabitapp/supareview/.github/workflows/thermos-review.yml@main
    secrets:
      THERMOS_OPENAI_API_KEY: ${{ secrets.CODEX_BALANCER_API_KEY }}
